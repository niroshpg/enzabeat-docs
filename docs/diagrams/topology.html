<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzabeat — system topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Enzabeat</p>
    <h1>Each phone listens to its own player. Only the beat is shared.</h1>

    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-title topology-desc">
      <title id="topology-title">Enzabeat system topology</title>
      <desc id="topology-desc">Each player's phone hears that player through its built-in microphone, or through an optional microphone mounted on the instrument, and a part tracker on the phone follows that player's own part. The phone sends only its position to a session host on a laptop or leader phone, which keeps one shared clock, weighs the positions from every player's phone and sends one shared beat back, so every score view shows the same cursor. Audio never leaves the phone.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones (painted before arrows and nodes) ===== -->
      <rect x="24" y="88" width="592" height="384" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="204" y="92" width="232" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="101" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EACH PLAYER'S PHONE · AUDIO NEVER LEAVES IT</text>

      <rect x="648" y="88" width="288" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="688" y="92" width="208" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SESSION HOST · LAPTOP OR LEADER PHONE</text>

      <!-- ===== arrows (drawn before nodes) ===== -->
      <!-- player → built-in mic -->
      <path d="M 188,288 H 200 Q 208,288 208,280 V 208 Q 208,200 216,200 H 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- player → instrument mic (optional) -->
      <path d="M 188,312 H 200 Q 208,312 208,320 V 392 Q 208,400 216,400 H 232" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- built-in mic → tracker -->
      <path d="M 376,200 H 396 Q 404,200 404,208 V 276 Q 404,284 412,284 H 436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- instrument mic → tracker (optional) -->
      <path d="M 376,400 H 396 Q 404,400 404,392 V 324 Q 404,316 412,316 H 436" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- tracker → score view: the player's own note, no network involved -->
      <line x1="508" y1="256" x2="508" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tracker → host: position only -->
      <line x1="580" y1="300" x2="704" y2="300" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- host → score view: the shared beat -->
      <path d="M 760,256 V 172 Q 760,164 752,164 H 580" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- other phones ⇄ host -->
      <line x1="768" y1="392" x2="768" y2="344" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="816" y1="344" x2="816" y2="392" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- ===== arrow labels ===== -->
      <rect x="516" y="222" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="231" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YOUR NOTE</text>

      <rect x="616" y="280" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="289" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POSITION</text>

      <rect x="646" y="144" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="153" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHARED BEAT</text>

      <rect x="704" y="362" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="371" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POSITIONS</text>

      <rect x="824" y="362" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="858" y="371" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHARED BEAT</text>

      <!-- ===== nodes ===== -->
      <!-- Player (input) -->
      <rect x="44" y="264" width="144" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="44" y="264" width="144" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="52" y="270" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="72" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYER</text>
      <text x="116" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Player</text>
      <text x="116" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">instrument or voice</text>

      <!-- Built-in mic -->
      <rect x="232" y="168" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="168" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="174" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="254" y="183" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MIC</text>
      <text x="304" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Built-in mic</text>
      <text x="304" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">always there</text>

      <!-- Instrument mic (optional) -->
      <rect x="232" y="368" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="368" width="144" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="240" y="374" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="266" y="383" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
      <text x="304" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Instrument mic</text>
      <text x="304" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clip-on or pickup</text>

      <!-- Score view -->
      <rect x="436" y="128" width="144" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="436" y="128" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="444" y="134" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="466" y="143" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCREEN</text>
      <text x="508" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score view</text>
      <text x="508" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared cursor band</text>

      <!-- Part tracker (focal) -->
      <rect x="436" y="256" width="144" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="436" y="256" width="144" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="444" y="262" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="468" y="271" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACKER</text>
      <text x="508" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Part tracker</text>
      <text x="508" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">follows your own part</text>
      <text x="508" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs on the phone</text>

      <!-- Session host -->
      <rect x="704" y="256" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="256" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="262" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="728" y="271" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="792" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session host</text>
      <text x="792" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one shared clock</text>
      <text x="792" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weighs every position</text>

      <!-- Other players' phones (external) -->
      <rect x="704" y="392" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="392" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="712" y="398" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="732" y="407" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PEERS</text>
      <text x="792" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Other players' phones</text>
      <text x="792" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same app, own parts</text>

      <!-- ===== legend ===== -->
      <line x1="24" y1="496" x2="936" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="104" y="508" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="122" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">tracking (focal)</text>

      <rect x="264" y="508" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="282" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">audio stays inside</text>

      <rect x="436" y="508" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="454" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">optional add-on</text>

      <line x1="588" y1="514" x2="608" y2="514" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="616" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">network message</text>

      <line x1="748" y1="514" x2="768" y2="514" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="776" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">optional sound path</text>
    </svg>
  </div>
</body>
</html>
