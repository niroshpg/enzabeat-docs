<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cursor-modes-title cursor-modes-desc">
      <title id="cursor-modes-title">Enzabeat cursor modes</title>
      <desc id="cursor-modes-desc">State machine for the shared cursor during a song: once everyone is ready the leader starts a count-in, then the cursor either follows the band from what the phones hear or runs at a tempo the leader sets. When the phones are unsure where the band is, the cursor holds the last tempo and returns to following the band as soon as it is heard again; both modes end at the last bar, and the leader can pause, seek or switch mode at any time with every screen moving together.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== transitions (drawn before states) ===== -->
      <line x1="68" y1="160" x2="112" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ready → count-in -->
      <line x1="272" y1="160" x2="320" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- count-in → following -->
      <line x1="480" y1="160" x2="528" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- following → end -->
      <line x1="688" y1="160" x2="808" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- count-in → conductor -->
      <line x1="400" y1="200" x2="400" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- following → holding tempo -->
      <line x1="576" y1="200" x2="576" y2="280" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- holding tempo → following -->
      <line x1="640" y1="280" x2="640" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- conductor → end, routed under the fallback state -->
      <path d="M 400,360 V 384 Q 400,392 408,392 H 808 Q 816,392 816,384 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== transition labels ===== -->
      <rect x="280" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START</text>
      <rect x="484" y="140" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FOLLOW</text>
      <rect x="720" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAST BAR</text>
      <rect x="408" y="228" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="436" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONDUCTOR</text>
      <rect x="524" y="228" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="546" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNSURE</text>
      <rect x="648" y="228" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEARD AGAIN</text>
      <rect x="572" y="372" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAST BAR</text>

      <!-- ===== states ===== -->
      <circle cx="60" cy="160" r="6" fill="#2d3142"/>

      <!-- Ready -->
      <rect x="112" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="112" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="120" y="128" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="140" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOBBY</text>
      <text x="192" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ready</text>
      <text x="192" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">everyone has joined</text>

      <!-- Count-in -->
      <rect x="320" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="128" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="348" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
      <text x="400" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Count-in</text>
      <text x="400" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on every screen</text>

      <!-- Following the band (focal) -->
      <rect x="528" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="528" y="120" width="160" height="80" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="536" y="128" width="44" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="558" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOLLOW</text>
      <text x="608" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Following the band</text>
      <text x="608" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">players agree on a beat</text>

      <!-- Conductor tempo -->
      <rect x="320" y="280" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="280" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="288" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="358" y="297" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONDUCTOR</text>
      <text x="400" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conductor tempo</text>
      <text x="400" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the leader sets the pace</text>

      <!-- Holding tempo (fallback) -->
      <rect x="528" y="280" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="528" y="280" width="160" height="80" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="536" y="288" width="56" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="564" y="297" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>
      <text x="608" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Holding tempo</text>
      <text x="608" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keeps the last tempo</text>

      <circle cx="816" cy="160" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="816" cy="160" r="5" fill="#2d3142"/>

      <!-- ===== annotation ===== -->
      <text x="112" y="296" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The leader can pause, seek</text>
      <text x="112" y="316" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">or switch mode at any time;</text>
      <text x="112" y="336" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">every screen moves together.</text>

      <!-- ===== legend ===== -->
      <line x1="24" y1="420" x2="936" y2="420" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="24" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="110" cy="441" r="6" fill="#2d3142"/>
      <text x="122" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">start</text>

      <circle cx="210" cy="441" r="7" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="210" cy="441" r="4" fill="#2d3142"/>
      <text x="224" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">end of song</text>

      <rect x="324" y="436" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="342" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">state</text>

      <rect x="424" y="436" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="442" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">listening to the band</text>

      <rect x="604" y="436" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="622" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">fallback</text>

      <line x1="724" y1="442" x2="744" y2="442" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="752" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">exception path</text>
    </svg>
