<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzabeat — one core, two native apps</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Enzabeat</p>
    <h1>The screens are written twice. The listening and timing, once.</h1>

    <svg viewBox="0 0 960 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="native-core-title native-core-desc">
      <title id="native-core-title">Enzabeat: one shared core, two native apps</title>
      <desc id="native-core-desc">A SwiftUI iPhone app and a Jetpack Compose Android app sit above a native boundary, crossed through Swift–C++ interop and JNI with values in and values out; below it one shared C++ core provides four parts used by both apps: realtime audio capture, the part tracker that follows each player's own part, the shared clock and session logic that also runs the session host, and score engraving with the cursor's position map.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones ===== -->
      <rect x="56" y="40" width="848" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="88" y="34" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="188" y="43" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NATIVE UI · ONE PER PLATFORM</text>

      <rect x="56" y="208" width="848" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="88" y="202" width="208" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="211" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED C++ CORE · BUILT ONCE</text>

      <!-- ===== the boundary ===== -->
      <line x1="40" y1="184" x2="920" y2="184" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="56" y="176" width="236" height="16" rx="2" fill="#f5f5f5"/>
      <text x="174" y="187" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">VALUES IN, VALUES OUT · NO CALLBACKS</text>

      <!-- ===== arrows (drawn before nodes) ===== -->
      <line x1="300" y1="136" x2="300" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="660" y1="136" x2="660" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 648,288 V 312 Q 648,320 656,320 H 784 Q 792,320 792,328 V 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== arrow labels ===== -->
      <rect x="308" y="146" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SWIFT ⇄ C++</text>
      <rect x="668" y="146" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JNI</text>

      <!-- ===== UI nodes ===== -->
      <rect x="200" y="72" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="72" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="222" y="87" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">iOS</text>
      <text x="300" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iPhone app</text>
      <text x="300" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SwiftUI</text>

      <rect x="560" y="72" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="72" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="78" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="596" y="87" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANDROID</text>
      <text x="660" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Android app</text>
      <text x="660" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jetpack Compose</text>

      <!-- ===== core nodes ===== -->
      <rect x="200" y="232" width="560" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="232" width="560" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="224" y="247" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="480" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared core</text>
      <text x="480" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one interface, identical behaviour on both platforms</text>

      <rect x="80" y="352" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="352" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="88" y="358" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="98" y="367" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="168" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audio capture</text>
      <text x="168" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">realtime, low latency</text>
      <text x="168" y="420" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">built-in or instrument mic</text>

      <rect x="288" y="352" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="352" width="176" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="296" y="358" width="20" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="306" y="367" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="376" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Part tracker</text>
      <text x="376" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">follows your own part</text>
      <text x="376" y="420" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same maths everywhere</text>

      <rect x="496" y="352" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="352" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="504" y="358" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="514" y="367" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="584" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clock + session</text>
      <text x="584" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one clock, one beat</text>
      <text x="584" y="420" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">also runs the host</text>

      <rect x="704" y="352" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="352" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="358" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="722" y="367" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="792" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score engraving</text>
      <text x="792" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MusicXML → notation</text>
      <text x="792" y="420" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cursor position map</text>

      <!-- ===== annotation ===== -->
      <text x="56" y="488" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">where the two platforms must agree to the millisecond, there is only one implementation</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="128" y="520" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="146" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the hard part (focal)</text>

      <line x1="304" y1="526" x2="324" y2="526" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>
      <text x="332" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">native boundary</text>

      <rect x="476" y="520" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="494" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">component</text>
    </svg>
  </div>
</body>
</html>
